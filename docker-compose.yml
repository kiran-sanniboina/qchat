version: '3.8'

services:
  mongo:
    image: mongo:6.0
    container_name: qchat_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - qchat_mongo_data:/data/db

  qds-core:
    build:
      context: ./qds-service
      dockerfile: Dockerfile
    container_name: qchat_qds_core
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    networks:
      - qchat-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qchat_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/qchat
      - JWT_SECRET=qchat_quantum_jwt_secret_key_2026_super_safe
      - QDS_SERVICE_URL=http://qds-core:8000
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongo
      - qds-core
    networks:
      - qchat-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qchat_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - qchat-network

networks:
  qchat-network:
    driver: bridge

volumes:
  qchat_mongo_data:

